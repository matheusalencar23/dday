name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancela execuções antigas do mesmo branch quando chega um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Lint, testes unitários e build
    # Versão fixa: o ubuntu-latest está migrando para o Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes unitários (Karma + Chrome headless)
        run: npm run test:ci

      - name: Build de produção (inclui budgets de tamanho)
        run: npm run build

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Testes e2e (Cypress)
    # Versão fixa: o ubuntu-latest está migrando para o Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Instala as dependências (com cache do binário do Cypress), sobe o
      # servidor de desenvolvimento e roda os testes quando ele responder.
      # Usa 127.0.0.1 em vez de localhost: no runner, localhost também resolve
      # para ::1 (IPv6), onde o ng serve não escuta.
      - uses: cypress-io/github-action@v7
        with:
          start: npm start -- --host 127.0.0.1
          wait-on: http://127.0.0.1:4200
          wait-on-timeout: 180
          config: baseUrl=http://127.0.0.1:4200

      - name: Publicar screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
