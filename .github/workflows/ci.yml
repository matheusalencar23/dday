name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancela execuções antigas do mesmo branch quando chega um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Lint, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes unitários (Karma + Chrome headless)
        run: npm run test:ci

      - name: Build de produção (inclui budgets de tamanho)
        run: npm run build

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Testes e2e (Cypress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Instala as dependências (com cache do binário do Cypress), sobe o
      # servidor de desenvolvimento e roda os testes quando ele responder.
      - uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: http://localhost:4200
          wait-on-timeout: 180

      - name: Publicar screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
