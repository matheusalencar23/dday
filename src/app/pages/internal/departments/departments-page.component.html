<dd-page-title>{{ 'app.departments.title' | translate }}</dd-page-title>

<div class="filter">
  <dd-input-search
    [placeholder]="'app.departments.search' | translate"
    [ariaLabel]="'app.departments.search' | translate"
    [hasBorder]="true"
    [(ngModel)]="searchTerm"
    (ngModelChange)="filterByTerm($event)"
  />
  <div class="filter-actions">
    <dd-select
      [items]="itemsPerPageOptions"
      [(ngModel)]="filter.itemsPerPage"
      (ngModelChange)="showDepartments()"
      [ariaLabel]="'app.payments.items-per-page' | translate"
    />
    <button type="button" class="dd-button dd-button--primary" (click)="openForm()">
      <ng-icon name="heroPlus" size="18" aria-hidden="true"></ng-icon>
      {{ 'app.departments.add' | translate }}
    </button>
  </div>
</div>

<dd-loading-spinner *ngIf="loading" />
<ng-container *ngIf="departments$ | async as departments">
  <ng-container *ngIf="!loading">
    <dd-table
      [tableConfig]="tableConfig"
      [tableContent]="departments.data"
      (orderBy)="order($event)"
      [dataSortProperty]="filter.sortBy"
      [desc]="filter.desc"
      [actions]="true"
      (edit)="openForm($event)"
      (remove)="confirmRemove($event)"
    />
    <dd-pagination
      [page]="filter.page"
      [itemsPerPage]="filter.itemsPerPage"
      [total]="departments.total"
      (pageEvent)="pagination($event)"
    />
  </ng-container>
</ng-container>
