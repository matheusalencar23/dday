<dd-page-title>{{ 'app.employees.title' | translate }}</dd-page-title>

<div class="filter">
  <dd-input-search
    [placeholder]="'app.employees.search' | translate"
    [ariaLabel]="'app.employees.search' | translate"
    [hasBorder]="true"
    [(ngModel)]="searchTerm"
    (ngModelChange)="filterByTerm($event)"
  />
  <div class="filter-actions">
    <dd-select
      [items]="itemsPerPageOptions"
      [(ngModel)]="list.filter.itemsPerPage"
      (ngModelChange)="list.update({ page: 1 })"
      [ariaLabel]="'app.payments.items-per-page' | translate"
    />
    <button type="button" class="dd-button dd-button--primary" (click)="openForm()">
      <ng-icon name="heroPlus" size="18" aria-hidden="true"></ng-icon>
      {{ 'app.employees.add' | translate }}
    </button>
  </div>
</div>

<ng-container *ngIf="list.state$ | async as state">
  <dd-loading-spinner *ngIf="state.status === 'loading'" />
  <dd-error-state *ngIf="state.status === 'error'" (retry)="list.retry()" />
  <ng-container *ngIf="state.status === 'success'">
    <dd-table
      [tableConfig]="tableConfig"
      [tableContent]="state.data.data"
      (orderBy)="list.order($event)"
      [dataSortProperty]="list.filter.sortBy"
      [desc]="list.filter.desc"
      [actions]="true"
      (edit)="openForm($event)"
      (remove)="confirmRemove($event)"
    />
    <dd-pagination
      [page]="list.filter.page"
      [itemsPerPage]="list.filter.itemsPerPage"
      [total]="state.data.total"
      (pageEvent)="list.update({ page: $event.page })"
    />
  </ng-container>
</ng-container>
