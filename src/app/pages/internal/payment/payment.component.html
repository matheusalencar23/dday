<dd-page-title>{{ 'app.payments.title' | translate }}</dd-page-title>
<div class="filter">
  <dd-input-search
    [placeholder]="'app.payments.search' | translate"
    [hasBorder]="true"
    [(ngModel)]="searchTerm"
    (ngModelChange)="filterByTerm($event)"
  />
  <dd-select
    [items]="itemsPerPageOptions"
    [(ngModel)]="filter.itemsPerPage"
    (ngModelChange)="showPayments()"
    [ariaLabel]="'app.payments.items-per-page' | translate"
  />
</div>
<ng-container *ngIf="state$ | async as state">
  <dd-loading-spinner *ngIf="state.status === 'loading'" />
  <dd-error-state *ngIf="state.status === 'error'" (retry)="getPayments()" />
  <ng-container *ngIf="state.status === 'success'">
    <dd-table
      [tableConfig]="tableConfig"
      [tableContent]="state.data.data"
      (orderBy)="order($event)"
      [dataSortProperty]="filter.sortBy"
      [desc]="filter.desc"
    />
    <dd-pagination
      [page]="filter.page"
      [itemsPerPage]="filter.itemsPerPage"
      [total]="state.data.total"
      (pageEvent)="pagination($event)"
    />
  </ng-container>
</ng-container>
