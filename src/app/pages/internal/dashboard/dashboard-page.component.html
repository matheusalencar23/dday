<dd-page-title> {{ "app.dashboard.title" | translate }} </dd-page-title>
<section *ngIf="dashboard$ | async as dashboard">
  <div class="cards">
    <div *ngFor="let cardData of dashboard.cards">
      <dd-card [data]="cardData"></dd-card>
    </div>
  </div>

  <div class="charts">
    <dd-request-per-day-chart
      [title]="'app.dashboard.request-trend' | translate"
      [currentMonthLabel]="'app.dashboard.current-month' | translate"
      [previousMonthLabel]="'app.dashboard.previous-month' | translate"
    ></dd-request-per-day-chart>
    <dd-bar-chart
      [title]="'app.dashboard.monthly-amount' | translate"
      color="#F6C77D"
    ></dd-bar-chart>
    <dd-bar-chart
      [title]="'app.dashboard.monthly-requests' | translate"
    ></dd-bar-chart>
    <dd-available-liquidity-chart
      [title]="'app.dashboard.liquidity' | translate"
    ></dd-available-liquidity-chart>
  </div>
</section>
