<dd-page-title> {{ "app.dashboard.title" | translate }} </dd-page-title>
<section *ngIf="dashboard$ | async as dashboard">
  <div class="cards">
    <div *ngFor="let cardData of dashboard.cards">
      <dd-card [data]="cardData"></dd-card>
    </div>
  </div>

  <div class="charts">
    <dd-request-per-day-chart
      [labels]="dashboard.monthlyLabels"
      [values]="dashboard.currentYearMonthlyAmounts"
      [previousValues]="dashboard.previousYearMonthlyAmounts"
      [currentLabel]="dashboard.currentYearLabel"
      [previousLabel]="dashboard.previousYearLabel"
      [title]="'app.dashboard.request-trend' | translate"
    ></dd-request-per-day-chart>
    <dd-bar-chart
      [labels]="dashboard.yearlyLabels"
      [values]="dashboard.yearlyAmountTotals"
      [title]="'app.dashboard.yearly-amount' | translate"
      color="#F6C77D"
    ></dd-bar-chart>
    <dd-bar-chart
      [labels]="dashboard.yearlyLabels"
      [values]="dashboard.yearlyRequestCounts"
      [title]="'app.dashboard.yearly-requests' | translate"
    ></dd-bar-chart>
    <dd-available-liquidity-chart
      [value]="dashboard.liquidityPercent"
      [title]="'app.dashboard.liquidity' | translate"
    ></dd-available-liquidity-chart>
  </div>
</section>
