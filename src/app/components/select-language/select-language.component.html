<h2>{{ 'app.language.title' | translate }}</h2>
<ul [attr.aria-label]="'app.language.title' | translate">
  <li>
    <button type="button" (click)="setLanguage('pt')" [attr.aria-pressed]="getLanguage() === 'pt'">
      {{ 'app.language.portuguese' | translate }}
      <ng-icon
        *ngIf="getLanguage() === 'pt'"
        name="heroCheck"
        size="22"
        color="var(--green-1)"
      ></ng-icon>
    </button>
  </li>
  <li>
    <button type="button" (click)="setLanguage('en')" [attr.aria-pressed]="getLanguage() === 'en'">
      {{ 'app.language.english' | translate }}
      <ng-icon
        *ngIf="getLanguage() === 'en'"
        name="heroCheck"
        size="22"
        color="var(--green-1)"
      ></ng-icon>
    </button>
  </li>
</ul>
