<header>
  <button
    type="button"
    class="menu-bar-icon"
    [attr.aria-label]="'app.header.open-menu' | translate"
    (click)="openSidebar.emit()"
  >
    <ng-icon name="heroBars3Solid" size="26" aria-hidden="true"></ng-icon>
  </button>
  <dd-input-search
    [placeholder]="'app.search-placeholder' | translate"
    [ariaLabel]="'app.search-placeholder' | translate"
  ></dd-input-search>
  <div class="header-actions">
    <ng-icon
      name="heroInformationCircle"
      size="22"
      aria-hidden="true"
    ></ng-icon>
    <ng-icon name="heroBell" size="22" aria-hidden="true"></ng-icon>
    <button
      type="button"
      class="icon-action"
      [attr.aria-label]="'app.header.change-language' | translate"
      (click)="openLanguageModal()"
    >
      <ng-icon name="heroLanguage" size="22" aria-hidden="true"></ng-icon>
    </button>
    <img src="assets/avatar.svg" alt="avatar" class="avatar-action" />
  </div>
</header>
