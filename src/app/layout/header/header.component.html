<header>
  <button
    type="button"
    class="menu-bar-icon"
    [attr.aria-label]="'app.header.open-menu' | translate"
    (click)="openSidebar.emit()"
  >
    <ng-icon name="heroBars3Solid" size="22" aria-hidden="true"></ng-icon>
  </button>
  <button
    type="button"
    class="search-trigger"
    aria-haspopup="dialog"
    [attr.aria-keyshortcuts]="isMac ? 'Meta+K' : 'Control+K'"
    (click)="openSearch()"
  >
    <ng-icon name="heroMagnifyingGlassSolid" size="20" aria-hidden="true"></ng-icon>
    <span>{{ 'app.search-placeholder' | translate }}</span>
    <kbd aria-hidden="true">{{ isMac ? '⌘' : 'Ctrl' }} K</kbd>
  </button>
  <div class="header-actions">
    <button
      type="button"
      class="icon-action"
      aria-haspopup="dialog"
      [attr.aria-label]="'app.header.about' | translate"
      (click)="openAbout()"
    >
      <ng-icon name="heroInformationCircle" size="22" aria-hidden="true"></ng-icon>
    </button>
    <dd-notifications></dd-notifications>
    <button
      type="button"
      class="icon-action"
      aria-haspopup="dialog"
      [attr.aria-label]="'app.header.change-language' | translate"
      (click)="openLanguageModal()"
    >
      <ng-icon name="heroLanguage" size="22" aria-hidden="true"></ng-icon>
    </button>
    <img src="assets/avatar.svg" alt="avatar" class="avatar-action" />
  </div>
</header>
